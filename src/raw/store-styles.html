
<!-- Full CSS Of PRODUCT Listing Compelte Process A_Z -->

<style>
    /* Full Width Main Card */
    .m-master-box { width: 100%; font-family: 'Segoe UI', sans-serif; margin-bottom: 30px; }
        .m-main-card { background: #fff; position: relative; width: 100%; border-radius: 15px; overflow: hidden; text-align: center; }

    /* iPhone/Safari: font auto-bara na ho */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    :root {
        /* [1. LAPTOP / DESKTOP] */
        --d-save-f: 14px;
        --d-save-top: 12px;
        --d-save-left: 12px;
        /* [2. TABLET] */
        --t-save-f: 11px;
        --t-save-top: 10px;
        /* [3. MOBILE] */
        --m-save-f: 14px;
        --m-save-top: 8px;
        --m-save-left: 8px;
    }

    .m-save-float {
        position: absolute;
        font-weight: 900;
        color: #800000;
        z-index: 10;
        animation: floatAnim 1.5s infinite alternate;
        top: var(--d-save-top) !important;
        left: var(--d-save-left) !important;
        font-size: var(--d-save-f) !important;
    }
    @media (max-width: 991px) {
        .m-save-float { top: var(--t-save-top) !important; font-size: var(--t-save-f) !important; }
    }
    @media (max-width: 480px) {
        .m-save-float { top: var(--m-save-top) !important; left: var(--m-save-left) !important; font-size: var(--m-save-f) !important; }
    }
    @keyframes floatAnim {
        from { transform: translateY(0); }
        to { transform: translateY(-6px); color: #e6007e; }
    }

    /* PRODUCT PAGE: pic aur product name clickable (popup khulta hai) */
    .m-hero-img { width: 100%; display: block; cursor: pointer !important; pointer-events: auto !important; -webkit-tap-highlight-color: transparent; }

    /* [UPDATED] PIC HOVER / TOUCH: pic halki si ubharti hai (zoom) aur ruki rehti hai.
       Mouse lagne ya touch hone par .is-active lagta hai (script se), aur jab tak page par
       kahin aur touch/click na ho, pic isi tarah ubhri rehti hai. Card ya saya nahi hilta.
       Laptop, PC, iPhone, tablet, har screen par same. */
    .m-hero-img {
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
        transform-origin: center center;
        touch-action: manipulation;
    }
    .m-hero-img.is-active { transform: scale(1.025); }
    @media (prefers-reduced-motion: reduce) {
        .m-hero-img { transition: none; }
        .m-hero-img.is-active { transform: none; }
    }

    .m-dot-anim { width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; display: inline-block; animation: pulseDot 1.2s infinite; vertical-align: middle; margin-right: 4px; }
    @keyframes pulseDot { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
    .m-stock-badge { font-size: 9px; color: #2ecc71; font-weight: 800; text-transform: uppercase; margin-top: 8px; }

    /* [NEW] Sab colors sold out ho to badge khud "out of stock": soft red, dot ruk jata hai */
    .m-stock-badge.is-out { color: #d6455d; }
    .m-stock-badge.is-out .m-dot-anim { background: #d6455d; animation: none; opacity: 0.9; }

    /* --- MAIN PAGE PRODUCT NAME CONTROL --- */
    :root {
        --d-pname-size: 18px;
        --d-pname-color: #000000;
        --d-pname-weight: 700;
        --m-pname-size: 14px;
        --m-pname-color: #333333;
    }

    .m-pname-line {
        margin: 6px 0 !important;
        padding: 0 5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-align: left !important;
        cursor: pointer !important;
        pointer-events: auto !important;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Segoe UI', sans-serif;
        font-size: 16px !important;
        font-weight: 700 !important;
        line-height: 1.2 !important;
        height: 2.4em;
        white-space: normal;
        word-break: break-word;
    }
    @media (max-width: 480px) {
        .m-pname-line {
            font-size: 9px !important;
            line-height: 1.1 !important;
            height: 2.2em;
            white-space: normal !important;
        }
    }

    :root {
        --d-new-p: 19px; --d-old-p: 15px; --d-p-color: #e6007e;
        --t-new-p: 15px; --t-old-p: 11px;
        --m-new-p: 18px; --m-old-p: 9px;
    }
    .m-new-p { color: var(--d-p-color) !important; font-weight: 950; font-size: var(--d-new-p) !important; }
    .m-old-p { color: black; text-decoration: line-through; font-size: var(--d-old-p) !important; margin-left: 5px; }
    @media (max-width: 991px) {
        .m-new-p { font-size: var(--t-new-p) !important; }
        .m-old-p { font-size: var(--t-old-p) !important; }
    }
    @media (max-width: 480px) {
        .m-new-p { font-size: var(--m-new-p) !important; }
        .m-old-p { font-size: var(--m-old-p) !important; }
    }

    /* ==========================================
       VIEW DETAILS - SOFT PINK CONTROL
       ========================================== */
    :root {
        --det-brd-width: 1px;
        --det-brd-color: #fecce6;
        --det-radius: 6px;
        --det-txt-main: #800000;
        --det-txt-shine: #ffb6c1;
        --det-txt-hover: #e6007e;
        --det-f-desk: 11px;
        --det-f-tab: 10.5px;
        --det-f-mob: 10px;
        --det-shine-dur: 4.5s;
        --det-pulse-dur: 2.5s;
        --det-shine-delay: 1s;
    }

    .m-details-trigger {
        display: inline-block;
        position: relative;
        padding: 8px 18px !important;
        font-size: var(--det-f-desk) !important;
        color: var(--det-txt-main) !important;
        -webkit-text-fill-color: var(--det-txt-main);
        font-weight: 800 !important;
        text-transform: uppercase;
        cursor: pointer;
        border: var(--det-brd-width) solid var(--det-brd-color) !important;
        border-radius: var(--det-radius) !important;
        background: transparent;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        margin: 15px 0;
        overflow: hidden;
        z-index: 1;
        -webkit-tap-highlight-color: transparent;
    }
    .m-details-trigger:hover {
        transform: translateY(-1.5px);
        border-color: var(--det-txt-hover) !important;
        background: rgba(230, 0, 126, 0.03) !important;
        color: var(--det-txt-hover) !important;
        -webkit-text-fill-color: var(--det-txt-hover) !important;
        transition: 0.3s;
    }
    @media (max-width: 768px) { .m-details-trigger { font-size: var(--det-f-tab) !important; padding: 7px 16px !important; } }
    @media (max-width: 480px) { .m-details-trigger { font-size: var(--det-f-mob) !important; padding: 6px 14px !important; } }

    .m-soft-line { display: none !important; }
    .m-soft-line { height: 1px; background: #fecce6; width: 100%; margin-top: 2px; }

    /* Elite Popup Layout */
    .m-maroon-top-bar { height: 2px; background: linear-gradient(90deg, #800000 0%, #c11c84 35%, #e6007e 50%, #c11c84 65%, #800000 100%); box-shadow: 0 1px 6px rgba(230, 0, 126, 0.22); }

    .m-close-x { position: fixed; top: 7px; right: 13px; font-size: 20px; font-weight: 500; line-height: 1; padding: 0; color: #800000; cursor: pointer; z-index: 100; background: #fff; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(128,0,0,0.10); border: 1px solid #fecce6; box-sizing: border-box; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
    .m-close-x:hover { background: #e6007e; color: #fff; border-color: #e6007e; transform: rotate(90deg); }
    @media (max-width: 1023px) { .m-close-x { top: calc(1vh + 5px); right: 9px; width: 30px; height: 30px; font-size: 19px; } }

    .m-pop-layout {
        display: flex;
        flex-direction: column;
        padding: 20px;
        max-height: 90vh;
        overflow-y: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
    }

    /* Slider with Pink Border */
    .m-slider-container {
        position: relative !important;
        border: 1px solid #fecce6 !important;
        border-radius: 15px !important;
        overflow: visible !important;
        margin: -4px -10px 12px -10px !important;
        padding: 5px !important;
    }
    @media (max-width: 480px) {
        .m-slider-container { margin: -3px -8px 4px -8px !important; }
    }
    .m-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .m-track img { min-width: 100%; aspect-ratio: 1/1; object-fit: contain; }

    /* PIC ARROW: chota, card ki border ke pass, card ke andar hi, andar ki taraf halki hilat */
    .m-arrow-next {
        position: absolute; top: 50%; right: 5px; transform: translateY(-50%);
        font-size: clamp(16px, 4.6vw, 20px); font-weight: 900;
        -webkit-text-stroke: 0.5px #800000; color: #800000; cursor: pointer; z-index: 10; line-height: 1;
        text-shadow: 0 1px 4px rgba(255,255,255,0.9);
        animation: arrowFwd 2.8s ease-in-out infinite;
        -webkit-tap-highlight-color: transparent;
    }
    @keyframes arrowFwd {
        0%, 100% { transform: translateY(-50%) translateX(0); opacity: 0.65; }
        50%      { transform: translateY(-50%) translateX(-2px); opacity: 1; }
    }

    .m-dots-wrapper { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
    .m-dot { width: 7px; height: 7px; background: #fecce6; border-radius: 50%; transition: 0.4s; }
    .m-dot.active { width: 20px; border-radius: 10px; background: #e6007e; }

    .m-pop-right { text-align: center; }
    .m-pop-heading { color: #800000; font-weight: 900; font-size: 15px; margin-bottom: 5px; }

    :root {
        --desk-title: 26px; --desk-body: 18px;
        --mob-title: 19px; --mob-body: 14px;
    }
    :root {
        --d-title: 26px; --d-sub: 20px; --d-body: 17px;
        --t-title: 22px; --t-sub: 18px; --t-body: 16px;
        --m-title: 19px; --m-sub: 16px; --m-body: 14px;
    }

    /* ==========================================
       MANUAL CONTROL CENTER
       ========================================== */
    :root {
        --d-title-size: 24px;
        --d-sub-size: 19px;
        --d-body-size: 16px;
        --d-line-height: 1.4;
        --d-top-gap: 2px;
        --d-para-gap: 5px;

        --t-title-size: 21px;
        --t-sub-size: 18px;
        --t-body-size: 15px;
        --t-line-height: 1.35;

        --m-title-size: 12px;
        --m-sub-size: 16px;
        --m-body-size: 14px;
        --m-line-height: 1.3;
        --m-top-gap: 0px;
        --m-para-gap: 4px;

        /* DESCRIPTION aur ADD TO CART ke beech gap (yahan se badal sakte ho) */
        --m-desc-btn-gap: 32px;
    }

    .m-pop-description {
        color: #333 !important;
        background: #ffffff !important;
        border: 1px solid #fecce6 !important;
        border-radius: 12px;
        white-space: pre-wrap !important;
        word-wrap: break-word !important;
        font-family: 'Segoe UI', sans-serif !important;
        box-sizing: border-box !important;
        text-align: left !important;
        font-size: var(--d-body-size) !important;
        line-height: var(--d-line-height) !important;
        padding: var(--d-top-gap) 20px 20px 20px !important;
    }

    .m-el-title {
        color: #800000 !important;
        font-weight: 950 !important;
        font-size: var(--d-title-size) !important;
        margin: 0 0 var(--d-para-gap) 0 !important;
        display: block;
        line-height: 1.1 !important;
    }

    .m-el-sub {
        color: #800000 !important;
        font-weight: 800 !important;
        font-size: var(--d-sub-size) !important;
        display: inline-block;
        margin-top: var(--d-para-gap) !important;
        margin-bottom: 2px !important;
    }

    /* PERMANENT PINK SCROLLBAR */
    .m-pop-layout::-webkit-scrollbar { width: 8px !important; display: block !important; }
    .m-pop-layout::-webkit-scrollbar-track { background: #fff5f8 !important; border-radius: 10px !important; box-shadow: inset 0 0 5px rgba(0,0,0,0.05) !important; }
    .m-pop-layout::-webkit-scrollbar-thumb { background: #e6007e !important; border-radius: 10px !important; border: 2px solid #fff5f8 !important; min-height: 40px !important; }
    .m-pop-layout { scrollbar-width: thin !important; scrollbar-color: #e6007e #fff5f8 !important; }

    @media (max-width: 480px) {
        .m-stock-in-badge {
            position: absolute !important;
            top: 428px !important;
            right: 25px !important;
            padding: 2px 7px !important;
            font-size: 7px !important;
            font-weight: 700 !important;
            text-transform: uppercase;
            background: #f0fff4 !important;
            color: #2ecc71 !important;
            border: 0.5px solid #2ecc71 !important;
            border-radius: 50px !important;
            z-index: 10 !important;
            pointer-events: none !important;
        }
        .m-pop-layout { position: relative !important; display: flex !important; flex-direction: column !important; }
        .m-slider-container { position: relative !important; overflow: visible !important; }
    }

    /* --- OVERLAY & BOX BASE --- */
    .m-pop-overlay {
        display: none; position: fixed; top: 0 !important; left: 0 !important;
        width: 100vw !important; height: 100vh !important;
        background: rgba(48, 0, 24, 0.5) !important; z-index: 2147483000 !important;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        overscroll-behavior: contain;
    }

    .m-pop-box {
        position: relative; width: 100%; height: 100%; background: #fff !important;
        border: none !important; outline: none !important;
        z-index: 2147483001;
        box-shadow: 0 30px 80px rgba(128, 0, 0, 0.25), 0 0 0 1px rgba(254, 204, 230, 0.7);
        overscroll-behavior: contain;
        -webkit-font-smoothing: antialiased;
    }

    /* --- DUPLICATE COLOR ALERT --- */
    .m-pink-popup {
        background: linear-gradient(135deg, #e6007e, #c11c84) !important;
        color: #ffffff !important;
        font-size: 11px !important;
        font-weight: 800 !important;
        letter-spacing: 0.3px !important;
        padding: 8px 16px !important;
        border-radius: 50px !important;
        position: absolute !important;
        top: -18px !important;
        right: 15px !important;
        z-index: 9999 !important;
        box-shadow: 0 6px 16px rgba(230, 0, 126, 0.25) !important;
        border: 1px solid rgba(255, 255, 255, 0.85) !important;
        display: none;
        animation: mBounce 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes mBounce { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* --- LAPTOP / DESKTOP BASE --- */
    @media (min-width: 1024px) {
        .m-pop-box { animation: mPopDesk 0.35s ease; }
        .m-add-to-bag-btn { margin-bottom: 40px !important; display: block !important; width: 100% !important; }
        .m-buy-now-btn { margin-top: 15px !important; display: block !important; width: 100% !important; }
    }
    @keyframes mPopDesk { from { opacity: 0; } to { opacity: 1; } }

    /* --- MOBILE --- */
    @media (max-width: 1023px) {
        .m-pop-overlay { display: none; align-items: flex-end; }
        .m-pop-box {
            position: fixed !important;
            top: 1vh !important;
            left: 0 !important;
            width: 100% !important;
            height: 99vh !important;
            border-radius: 25px 25px 0 0 !important;
            max-height: 99vh !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
            z-index: 2147483001 !important;
            box-shadow: 0 -20px 60px rgba(128,0,0,0.28) !important;
            animation: mPopSheet 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .m-add-to-bag-btn { margin-bottom: 25px !important; }
        .m-buy-now-btn { margin-top: 15px !important; }
    }
    @keyframes mPopSheet { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* iPhone / Safari: asli screen height (URL bar) aur safe area */
    @supports (height: 100dvh) {
        @media (max-width: 1023px) {
            .m-pop-box { height: 99dvh !important; max-height: 99dvh !important; }
        }
    }
    @media (max-width: 1023px) {
        .m-pop-layout { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important; }
    }

    /* --- ELITE ALERT STYLING ---
       [UPDATED] Ab bohat chota, patla aur soft (har device par, screen ke beech mein).
       Isi box mein sab alerts aate hain (colors khatam, sold out, stock limit waghera).
       Chota/bara karna ho to neeche width aur padding badlo. */
    #m-elite-alert {
        position: fixed !important;
        top: 50% !important; left: 50% !important; right: auto !important; bottom: auto !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
        background: #fffdfe !important;
        border: 1px solid #fbe3ee !important;
        border-radius: 12px !important;
        padding: 13px 14px 12px !important;
        width: min(232px, 72vw) !important;
        max-width: 232px !important;
        min-width: 0 !important;
        height: auto !important;
        box-sizing: border-box !important;
        text-align: center !important;
        box-shadow: 0 8px 22px -12px rgba(128, 0, 0, 0.18) !important;
        animation: mSoftFade 0.3s ease;
    }
    #m-elite-alert p { color: #7a5868; font-family: 'Segoe UI', sans-serif; line-height: 1.45; font-size: 12px; font-weight: 500; margin: 0 0 10px !important; }
    #m-elite-alert .m-al-title { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; color: #800000; margin: 0 0 5px; text-transform: uppercase; }
    #m-elite-alert .m-al-text { display: block; font-size: 11.5px; font-weight: 400; line-height: 1.45; color: #8a6a78; }
    #m-elite-alert button {
        background: #800000 !important; color: #fff !important; padding: 5px 18px !important;
        border-radius: 50px !important; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; border: none !important; cursor: pointer;
        box-shadow: 0 3px 8px -4px rgba(128, 0, 0, 0.30);
        transition: background 0.3s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    #m-elite-alert button:hover { background: #e6007e !important; transform: translateY(-1px); }
    /* peeche ka parda halka (pehle gehra tha) */
    #m-alert-overlay { background: rgba(48, 0, 24, 0.20) !important; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    @keyframes mSoftFade { from { opacity: 0; } to { opacity: 1; } }

    /* --- MOBILE RESPONSIVE --- */
    @media (max-width: 480px) {
        .m-pop-description {
            font-size: var(--m-body-size) !important;
            line-height: var(--m-line-height) !important;
            padding: var(--m-top-gap) 15px 15px 15px !important;
            margin-top: 0 !important;
        }
        .m-config-rows { margin-top: 12px !important; }
        .m-ship-dropdown { margin-top: 10px !important; }
        .m-el-title { font-size: var(--m-title-size) !important; margin-bottom: var(--m-para-gap) !important; }
        .m-el-sub { font-size: var(--m-sub-size) !important; margin-top: var(--m-para-gap) !important; }
    }

    /* Rows Management  [SOFT: thori zyada saans lene wali jagah] */
    .m-row-item { display: flex; gap: 10px; align-items: center; background: #fffafc; padding: 14px 12px; border-radius: 12px; border: 1px solid #fecce6; margin-bottom: 14px; position: relative; }
    .m-color-select { flex: 1; min-width: 0; border: none; background: none; font-size: 13px; font-weight: 800; color: #800000; outline: none; }
    .m-color-select option { font-weight: 700; }

    /* [UPDATED] QTY BOX: landscape (lamba), height patli, right side par */
    .m-qty-box { display: flex; align-items: stretch; flex-shrink: 0; box-sizing: border-box; overflow: hidden; border: 1px solid #fecce6; border-radius: 50px; background: #fff; height: 38px; width: 158px; margin-left: auto; box-shadow: 0 2px 8px rgba(128, 0, 0, 0.05); }
    .m-qty-box button { flex: 1; min-width: 46px; height: 100%; padding: 0; display: flex; align-items: center; justify-content: center; border: none; background: none; color: #e6007e; font-weight: 950; cursor: pointer; font-size: 22px; line-height: 1; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background 0.2s ease, transform 0.15s ease; }
    .m-qty-box button:hover { background: rgba(230, 0, 126, 0.08); }
    .m-qty-box button:active { background: rgba(230, 0, 126, 0.16); transform: scale(0.92); }
    .m-qty-box input { width: 58px; padding: 0; border: none; background: transparent; text-align: center; font-weight: 900; font-size: 15px; pointer-events: none; }

    .m-remove-btn { color: #e6007e; font-size: 10px; font-weight: 900; cursor: pointer; padding: 5px 12px; border: 1px solid #fecce6; border-radius: 50px; margin-left: 10px; }

    /* ROW ORDER: color pehle (left), Remove beech mein, QTY sab se right par */
    .m-row-item .m-color-select,
    .m-row-item .m-swatches { order: 1; }
    .m-row-item .m-remove-btn { order: 2; margin-left: 0; }
    .m-row-item .m-qty-box { order: 3; margin-left: auto; }

    @media (max-width: 480px) {
        .m-qty-box { width: 144px; height: 36px; }
        .m-qty-box button { min-width: 42px; font-size: 21px; }
        .m-qty-box input { width: 54px; }
        .m-row-item { gap: 8px; }
        .m-remove-btn { margin-left: 0; padding: 6px 10px; }
    }
    @media (max-width: 360px) {
        .m-qty-box { width: 130px !important; }
        .m-qty-box input { width: 46px !important; }
    }

    .m-pop-description { margin-bottom: var(--m-desc-btn-gap) !important; }

    /* ==========================================
       BUNDLE OFFER - POPUP KE ANDAR (patla, soft, lekin saaf nazar aane wala)
       Box "Select Color & QTY" heading ke upar, live line "Add Another Color" ke neeche,

    .m-ot-new { display: block; margin-top: 1px; font-size: 14.5px; font-weight: 800; color: #e6007e; }

    .m-offer-hint {

        margin: 4px 0 8px; padding: 0 4px; text-align: center;
        font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700;
        color: #800000; line-height: 1.4;

    .m-offer-hint:empty { display: none; }

    .m-offer-hint s { color: #8f8f8f; font-weight: 600; }

        .m-offer-tiers { gap: 5px; }
        .m-offer-tier { padding: 5px 3px; }
        .m-ot-n { font-size: 10px; }

        .m-ot-old { font-size: 10px; }
        .m-offer-hint { font-size: 11.5px; }

       (solid pink border, halka pink fill, bohat halka saans lene wala glow)
       ========================================== */
    .m-add-row-btn {
        background: linear-gradient(135deg, #fff7fb, #ffe9f3) !important;
        border: 1.5px solid #e6007e !important;
        border-radius: 14px !important;
        color: #800000 !important;
        padding: 14px 12px !important;
        font-size: 13px !important;
        font-weight: 900 !important;
        -webkit-text-stroke: 0.3px currentColor;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        box-shadow: 0 0 0 0 rgba(230, 0, 126, 0);
        animation: mAddGlow 4.2s ease-in-out infinite;
        transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;

    /* click ke baad pink na atke: focus/active mein bhi wohi soft rang */
    .m-add-row-btn:focus, .m-add-row-btn:active, .m-add-row-btn:focus-visible {

    .m-add-row-btn:active { transform: scale(0.985); }

    @media (hover: hover) and (pointer: fine) {
        .m-add-row-btn:hover { background: #e6007e !important; color: #fff !important; }
    }
    @keyframes mAddGlow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(230, 0, 126, 0); }
        50%      { box-shadow: 0 0 0 5px rgba(230, 0, 126, 0.08); }
    }
    @media (prefers-reduced-motion: reduce) { .m-add-row-btn { animation: none; } }

    /* ==========================================
       COLOR BOXES (dropdown ki jagah) - Amazon / Daraz jaisa
       [SOFT: thore bare tap-friendly boxes]
       [NEW] Har box ke oper (border par baithi) chhoti soft grey placeholder: "5 in stock" / "sold out"
       [NEW] Sold out box dhundhla (grey + halka), click par alert aata hai
       ========================================== */
    .m-row-item.m-has-swatches { flex-wrap: wrap; row-gap: 12px; }
    .m-has-swatches .m-color-select { display: none !important; }
    .m-has-swatches .m-remove-btn { margin-left: 0; }
    .m-swatches { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 12px 9px; text-align: left; padding-top: 6px; }
    .m-swatch {
        position: relative;
        display: inline-flex; align-items: center; gap: 7px;
        padding: 8px 14px 8px 9px; box-sizing: border-box; min-height: 36px;
        background: #fff; border: 1px solid #fecce6; border-radius: 10px;
        font-family: 'Segoe UI', sans-serif; font-size: 12.5px; font-weight: 700; color: #800000; line-height: 1.2;
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    .m-swatch:hover { border-color: #e6007e; }
    .m-sw-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.16); flex-shrink: 0; box-sizing: border-box; }

    /* oper wala soft placeholder (box ki border par, input ke label jaisa) */
    .m-sw-stock {
        position: absolute; top: -7px; left: 9px; padding: 0 4px;

<!-- [NEW] PIC HOVER / TOUCH: zoom ruka rahe jab tak page par kahin aur touch/click na ho
     (laptop, PC, iPhone, tablet, har screen par same) -->
<script>
(function () {
    function init() {
        var imgs = document.querySelectorAll('.m-hero-img');
        if (!imgs.length) return;

        function clearAll() {
            document.querySelectorAll('.m-hero-img.is-active').forEach(function (el) {
                el.classList.remove('is-active');
            });
        }

        function activate(el) {
            if (el.classList.contains('is-active')) return;
            clearAll();
            el.classList.add('is-active');
        }

        imgs.forEach(function (el) {
            // mouse pic par aaye (laptop / PC): zoom, mouse hatane par bhi ruka rahe
            el.addEventListener('pointerenter', function (e) {
                if (e.pointerType === 'mouse') activate(el);
            });
            // touch / click / pen: zoom
            el.addEventListener('pointerdown', function () { activate(el); });
        });

        // page par kahin aur touch/click ho to khtm
        document.addEventListener('pointerdown', function (e) {
            if (!e.target.closest('.m-hero-img')) clearAll();
        }, true);

        // Escape dabane par bhi khtm
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') clearAll();
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
